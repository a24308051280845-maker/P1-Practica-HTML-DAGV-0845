<!--define el idioma del documento(cambio a español)-->
<html lang="en">

<head>

    <!--asegura que la pagina sea escalable y se adapte a dispositivos moviles-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--titulo qeu aparece en la pestaña del navegador-->
    <title>Encabezados HTML</title>
</head>

<body>
   <!--encabezado de nivel 1: el mas importamte y con mayor tamaño-->

    <h2>Titulo 2</h2>
   <!--encabezado de nivel 3: subtitulo secundario-->
    <h3>Titulo 3</h3>
   <!--encabezado de nivel 4: subseccion-->
    <h4>Titulo 4</h4>
   <!--encabezado de nivel 5: subseccion menor-->
    <h5>Titulo 5</h5>
   <!--encabezado de nivel 6: el meenor jerarquia y tamaño de fuente-->
    <h6>Titulo 6</h6>
</body>

</html>
