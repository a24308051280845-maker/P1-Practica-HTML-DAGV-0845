<!DOCTYPE html>
<html lang="es"> <!-- Idioma de la página -->
<head>
    <!-- Para que se vean bien los acentos y las letras Ñ -->
    <meta charset="UTF-8">
    <!-- Para que la página se adapte a las pantallas de celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nombre que se ve en la pestaña del navegador -->
    <title>Enlaces en HTML</title>
</head>

<body>
    <!-- Título de nivel 2 para la sección -->
    <h2>Tipos de enlaces en HTML</h2>
    <!-- Texto en negrita para separar la sección de enlaces locales -->
    <p><strong>Enlaces/Hipervinculos a otra pagina del mismo sitio.</strong></p>
    <!-- Enlace normal a un archivo local (se abre en la misma pestaña) -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- target="_self" abre el enlace en la misma pestaña del navegador (es el comportamiento por defecto) -->
    <a href="2. Encabezados.html" target="_self">2. Encabezados</a><br>
    <!-- target="_blank" abre el enlace en una PESTAÑA NUEVA -->
    <a href="3. Parrafos.html" target="_blank">3. Parrafos</a><br>
    <!-- target="_parent" abre el enlace en el marco o cuadro padre si la página usa marcos -->
    <a href="4. Salto de linea.html" target="_parent">4. Salto de linea</a><br>
    <!-- target="_top" abre el enlace ocupando todo el cuerpo de la ventana (rompe marcos) -->
    <a href="5. Enfatizado.html" target="_top">5. Enfatizado</a><br>
    <!-- Texto en negrita para la sección de enlaces a internet -->
    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p>
    <!-- Enlace a una página externa de internet -->
    <a href="https://www.google.com/">Google</a><br>
    <!-- Abre YouTube en la misma pestaña -->
    <a href="https://www.youtube.com/" target="_self">YouTube</a><br>
    <!-- Abre Facebook en una pestaña nueva del navegador -->
    <a href="https://www.facebook.com/" target="_blank">FaceBook</a><br>
    <!-- Abre Wikipedia en el marco superior padre -->
    <a href="https://www.wikipedia.com/" target="_parent">WikiPedia</a><br>
    <!-- Abre Yahoo cargando la página completa en la ventana principal -->
    <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo!</a><br>
</body>
</html>
