<!DOCTYPE html>
<html lang="es"> <!-- Idioma de la página -->

<head>
    <!-- Para que se vean bien los acentos y las letras Ñ -->
    <meta charset="UTF-8"> 
    <!-- Para que la página se adapte a celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Nombre en la pestaña del navegador -->
    <title>Imagenes en HTML</title>
</head>

<body>
    <!-- Título principal de la sección -->
    <h2>Imagenes en HTML</h2>
    <!-- Título de nivel 3 para imágenes guardadas en tu misma carpeta -->
    <h3>Locales</h3>
    <!-- <img> sirve para mostrar una imagen. src es la ruta del archivo y alt es el texto explicativo si la imagen no carga -->
    <img src="caritas.png" alt="Imagen de carita feliz">
    <!-- Subtítulo para imágenes locales ajustadas de tamaño -->
    <h3>Locales redismensionado</h3>
    <!-- width cambia el ancho y height cambia el alto de la imagen en píxeles -->
    <img src="imagenes/carita.png" alt="Carita feliz pequeña" width="200" height="100">
    <!-- Subtítulo para imágenes cargadas directamente desde una página web -->
    <h3>Desde internet</h3>
    <!-- En src ponemos el enlace directo (URL) de la imagen en internet -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200" 
    alt="Carita feliz de internet">
    <!-- Subtítulo para imágenes con movimiento (GIFs) -->
    <h3>Animaciones</h3>
    <!-- Se usa la misma etiqueta <img> pero con un archivo o enlace .gif -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200" 
    alt="Imagen animada GIF">
</body>
</html>
